apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dev-app
  template:
    metadata:
      labels:
        app: dev-app # This perfectly matches the Service selector
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
