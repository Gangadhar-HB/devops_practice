apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dev-app
  template:
    metadata:
      labels:
        app: dev-app # This perfectly matches the Service selector
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dev-svc
spec:
  type: NodePort
  selector:
    app: dev-app
  ports:
    - port: 80
      targetPort: 80 # Updated to match Nginx default
      nodePort: 30080
